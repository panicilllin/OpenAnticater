name: Release

# 推送 vX.Y.Z 标签时：测试、打包、生成构建来源证明，创建草稿 Release，人工检查后再发布。
# On a vX.Y.Z tag: test, package, attest build provenance and open a draft release for review.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write      # create the release
  id-token: write      # build provenance attestation
  attestations: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # build number = commit count

      - name: Check tag matches Info.plist
        run: |
          plist=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$plist" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match CFBundleShortVersionString $plist"
            exit 1
          fi
          echo "VERSION=$tag" >> "$GITHUB_ENV"

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Package
        run: |
          ./scripts/build-app.sh
          codesign --verify --deep --strict build/release/OpenAnticater.app
          mkdir dist
          zip="OpenAnticater-${VERSION}-arm64.zip"
          # ditto keeps the code signature and extended attributes intact.
          ditto -c -k --keepParent build/release/OpenAnticater.app "dist/$zip"
          (cd dist && shasum -a 256 "$zip" > "$zip.sha256")
          cat dist/*.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.zip

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft \
            --title "OpenAnticater $VERSION" \
            --notes-file .github/release-notes.md \
            --generate-notes
