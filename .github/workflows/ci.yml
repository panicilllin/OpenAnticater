name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS 26 / Xcode 26
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Package app
        run: ./scripts/build-app.sh

  # 提前发现新版 Xcode 的问题；预览镜像，失败不阻塞。
  # Early warning for the next Xcode; preview image, failures don't block.
  next-xcode:
    name: Xcode 27 (preview)
    runs-on: xcode-27
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
